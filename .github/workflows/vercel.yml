name: Tracker site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "5 17 * * *"  # 00:05 in Vietnam: rebuild so the README card's streak rolls over to the new day

concurrency:
  group: vercel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TZ: Asia/Ho_Chi_Minh  # "today" for the streak, same as the local machine
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: finished dates come from git log
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 dsa site
      # Retry: the npm registry occasionally 404s on a freshly published dependency.
      - run: |
          for i in 1 2 3; do npm install --global vercel && exit 0; sleep 20; done
          exit 1
      # Links _site to the "dsa-tracker" project (created on the first run), then ships it as static files.
      - run: vercel link --yes --project dsa-tracker --token "$VERCEL_TOKEN"
        working-directory: _site
      - run: vercel deploy --prod --yes --token "$VERCEL_TOKEN"
        working-directory: _site
